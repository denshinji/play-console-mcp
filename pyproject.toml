[project]
name = "play-console-mcp"
version = "0.2.0"
description = "MCP server for Google Play Console: store listings, graphics, releases and reviews, with staged edits and safety guards."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "denshinji" }]
keywords = ["mcp", "model-context-protocol", "google-play", "play-console", "android", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mcp>=2.3,<3",
    "google-api-python-client>=2.150,<3",
    "google-auth>=2.35,<3",
]

[project.urls]
Homepage = "https://github.com/denshinji/play-console-mcp"
Repository = "https://github.com/denshinji/play-console-mcp"
Issues = "https://github.com/denshinji/play-console-mcp/issues"

[project.scripts]
play-console-mcp = "play_console_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["play_console_mcp", "skills", "tests", "README.md", "LICENSE", "server.json"]

[tool.hatch.build.targets.wheel]
packages = ["play_console_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
